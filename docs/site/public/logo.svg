<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loops mark">
  <title>Loops</title>
  <defs>
    <linearGradient id="lp-ring" x1="49" y1="32" x2="40.5" y2="17.3" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="14" fill="#101014" stroke="#2F2F38" stroke-width="1"/>

  <!-- Forward-only ring: a 300-degree arc that closes at the human. -->
  <path d="M49 32A17 17 0 1 1 40.5 17.28" stroke="url(#lp-ring)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M35.9 20.5L42.5 19.5L40.1 13.3" stroke="#A855F7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The human principal holding the checkpoint: the loop closes here. -->
  <circle cx="46.72" cy="23.5" r="5.2" fill="#F59E0B"/>
</svg>
